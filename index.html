<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>YoruteraTool</title>
  <link rel="stylesheet" href="common.css">
  <link rel="icon" type="image/png" href="images/favicon_circle_180.png">
  <link rel="apple-touch-icon" href="images/favicon_circle_180.png">
</head>
<body>
  <div class="site-bar">YoruteraTool</div>

  <main class="tools-index-main">
    <section class="tools-index-heading" aria-label="ツール一覧">
      <h1 class="tools-index-title">YoruteraTool</h1>
      <p class="tools-index-lead">使いたいツールを選択してください。</p>
    </section>

    <hr class="tools-index-divider">

    <!-- グループ1：作成系ツール（見出しなし） -->
    <section class="tools-index-grid" aria-label="作成ツール">
      <a class="tools-index-card" href="toolPages/texteditor.html">
        <h2 class="tools-index-card-title">テキストエディタ</h2>
        <p class="tools-index-card-subtitle">ゲーム内テキスト生成（§）</p>
      </a>

      <a class="tools-index-card" href="toolPages/pixelEditor.html">
        <h2 class="tools-index-card-title">ピクセルエディタ16</h2>
        <p class="tools-index-card-subtitle">16×16 アイテムテクスチャ用</p>
      </a>

      <a class="tools-index-card" href="toolPages/circleGenerator.html">
        <h2 class="tools-index-card-title">円ジェネレーター</h2>
        <p class="tools-index-card-subtitle">円・楕円のブロック配置計算用</p>
      </a>
    </section>

    <hr class="tools-index-divider">

    <!-- グループ2：コマンド系ツール -->
    <section aria-labelledby="tools-index-command-title">
      <h2 class="tools-index-group-title" id="tools-index-command-title">command</h2>

      <div class="tools-index-grid">
        <a class="tools-index-card" href="toolPages/searchItemID.html">
          <h2 class="tools-index-card-title">アイテムID検索（バニラ）</h2>
          <p class="tools-index-card-subtitle">統合版バニラ v26.40対応</p>
        </a>

        <a class="tools-index-card" href="toolPages/searchAddonItemID.html">
          <h2 class="tools-index-card-title">アイテムID検索（アドオン）</h2>
          <p class="tools-index-card-subtitle">独自アドオン&365blocks対応</p>
        </a>

        <a class="tools-index-card" href="toolPages/searchBiomeID.html">
          <h2 class="tools-index-card-title">バイオームID検索</h2>
          <p class="tools-index-card-subtitle">/locate biome コマンド用</p>
        </a>

        <a class="tools-index-card" href="toolPages/convertItemCommand.html">
          <h2 class="tools-index-card-title">NPC用コマンド生成</h2>
          <p class="tools-index-card-subtitle">アイテム交換・換金用</p>
        </a>
      </div>
    </section>
  </main>

  <footer>
    <p>© 2026 Yorutera Operations</p>
  </footer>

</html>
